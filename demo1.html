<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro al HTML</title>
    <style>
        /* cuando el el link no ha sido visitado todavia */
        a:link {

            color: red;
        }

        /* 
            cuando  el link ha sido visitado */
        a:visited {

            color: green;
        }

        /*  cundo el raton esta encima de enlace sin hacer clik en el mismo */

        a:hover {

            color: hotpink;
        }

        /* cuando el link ha sudo soleccionado  cuando esta activo esdecir cuando hacemos clik y mantenemos el clik preciondo sobre el link*/

        a:active {

            color: blue;
        }
        
    </style>

    <!-- Las PSeudoclases, son selectores que se aplica en dependencia  de estado de elemento -->

    <h1>Aplicar estilo a un enlace en independencia del estado del mismo</h1>

    <p><a href="https://vodafone.mejoresofertasfibra.com/">vodafone</a></p>

    <p><strong>Nota: </strong>a:hover tiene que ir despues de a:link y a:visited en las reglas de estilo para que sean efectivas. Y ademas,
la pseudoclase a:active tiene que ir despues de a:hover.</p>

</html>
